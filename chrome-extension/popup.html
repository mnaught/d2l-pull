<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 360px; }
  main { padding: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 15px; margin: 0; }
  #ver { font-size: 11px; font-weight: 400; color: var(--muted); }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
  .src { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
  .src h2 { font-size: 13px; margin: 0; }
  .status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--warn); }
  .courses { font-size: 11px; color: var(--muted); margin: -2px 0 8px; }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; }
  .row { display: flex; align-items: center; gap: 8px; margin: 0 0 10px 2px; }
  #week { width: 64px; flex: none; }
  .post { justify-content: space-between; }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  #log { margin-top: 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; font: 11px/1.45 ui-monospace, monospace; color: var(--muted); }
  #log:empty { display: none; }
  #log .h { color: var(--fg); font-weight: 600; margin-top: 4px; }
  #log .h2 { color: var(--fg); }
</style>
</head>
<body>
<main>
  <header>
    <h1>D2L Pull <span id="ver"></span></h1>
    <button class="link" id="settings">Settings</button>
  </header>

  <div id="setup" hidden>
    <p class="note">Tell D2L Pull where your Brightspace is and which courses to pull.</p>
    <button class="primary" id="setupBtn">Set up</button>
  </div>

  <div id="main" hidden>
    <section>
      <div class="src">
        <h2>Brightspace (D2L)</h2>
        <span class="status"><span class="dot" id="d2lDot"></span><span id="d2lStatus">checking…</span></span>
      </div>
      <div class="courses" id="courses"></div>
      <div class="checks">
        <label class="cb"><input type="checkbox" id="roster"> Roster</label>
        <label class="cb"><input type="checkbox" id="grades"> Grades</label>
      </div>
    </section>

    <div id="addons"></div>
    <p class="note" id="pending" hidden></p>

    <div class="row">
      <span>Through week</span>
      <input type="number" id="week" min="1" max="30" placeholder="auto">
      <span class="hint">blank = weeks since the course started</span>
    </div>
    <div class="row post">
      <label class="cb"><input type="checkbox" id="post"> Run post-processors</label>
      <button id="change" title="Choose the program each course runs after downloading">Change…</button>
    </div>

    <button class="primary" id="go">Download</button>
    <div id="log"></div>
  </div>
</main>
<script src="lib/select.js"></script>
<script src="lib/config.js"></script>
<script src="popup.js"></script>
</body>
</html>
