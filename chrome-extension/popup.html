<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --accent:#0b6bcb; --bg:#fff; --err:#c4161c; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --accent:#4493f8; --bg:#151b23; --err:#f85149; --ok:#3fb950; }
  }
  body { font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; width: 340px; }
  main { padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button { font: inherit; padding: 8px 6px; border: 1px solid var(--line); border-radius: 6px;
           background: transparent; color: var(--fg); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: default; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); }
  label { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; }
  input { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; padding: 5px 6px;
          border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--fg); }
  .row { display: flex; justify-content: space-between; margin-top: 8px; }
  #log { margin-top: 12px; max-height: 220px; overflow: auto; white-space: pre-wrap;
         font: 11px/1.45 ui-monospace, monospace; color: var(--muted); }
  #log:empty { display: none; }
  .err { color: var(--err); } .ok { color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>D2L Pull</h1>
  <p class="sub">Current-term courses you teach &rarr; CSVs in Downloads/d2l-pull</p>

  <div class="modes">
    <button data-mode="roster">Roster</button>
    <button data-mode="grades">Grades</button>
    <button data-mode="both" class="primary">Both</button>
  </div>

  <details>
    <summary>Settings</summary>
    <label>Your role (regex)<input id="roleMatch"></label>
    <label>Term filter, e.g. Fall 2026 (blank = use course dates)<input id="termMatch"></label>
    <label>Students (regex)<input id="studentMatch"></label>
    <label>Grade items (regex on "category item name")<input id="itemMatch"></label>
    <div class="row"><button id="reset">Reset defaults</button><button id="save">Save</button></div>
  </details>

  <div id="log"></div>
</main>
<script src="core.js"></script>
<script src="popup.js"></script>
</body>
</html>
