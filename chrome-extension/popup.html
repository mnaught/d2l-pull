<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --accent:#0b6bcb; --bg:#fff; --panel:#f6f8fa;
          --err:#c4161c; --ok:#1a7f37; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --accent:#4493f8; --bg:#151b23; --panel:#1c232c;
            --err:#f85149; --ok:#3fb950; --warn:#d29922; }
  }
  * { box-sizing: border-box; }
  body { font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; width: 360px; }
  main { padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
  .src { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .src h2 { font-size: 13px; margin: 0; }
  .status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--warn); }
  .checks { display: flex; gap: 18px; }
  label.cb { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .sub { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); display: flex; align-items: center; justify-content: space-between; }
  .week { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .week input { width: 56px; }
  button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
           background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { width: 100%; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: default; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); }
  details label.f { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; }
  input[type=text], input[type=number] { width: 100%; font: 12px ui-monospace, monospace; padding: 5px 6px;
          border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .row { display: flex; justify-content: space-between; margin-top: 10px; }
  #log { margin-top: 12px; max-height: 240px; overflow: auto; white-space: pre-wrap;
         font: 11px/1.45 ui-monospace, monospace; color: var(--muted); }
  #log:empty { display: none; }
  #log .h { color: var(--fg); font-weight: 600; margin-top: 4px; }
  .err { color: var(--err); } .ok { color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>D2L Pull</h1>

  <section>
    <div class="src">
      <h2>Brightspace (D2L)</h2>
      <span class="status"><span class="dot" id="d2lDot"></span><span id="d2lStatus">checking…</span></span>
    </div>
    <div class="checks">
      <label class="cb"><input type="checkbox" id="roster"> Roster</label>
      <label class="cb"><input type="checkbox" id="grades"> Grades</label>
    </div>
  </section>

  <section>
    <div class="src">
      <h2>CompTIA CertMaster</h2>
      <span class="status"><span class="dot" id="ctDot"></span><span id="ctStatus">checking…</span></span>
    </div>
    <div class="checks">
      <label class="cb"><input type="checkbox" id="labs"> Labs</label>
      <label class="cb"><input type="checkbox" id="quizzes"> Quizzes</label>
    </div>
    <div class="sub">
      <label class="cb"><input type="checkbox" id="convert"> Run converter after download</label>
      <span class="week">Week <input type="number" id="week" min="1" max="20" placeholder="auto"></span>
    </div>
  </section>

  <button class="primary" id="go">Download</button>

  <details>
    <summary>Settings</summary>
    <label class="f">Save to (folder inside Downloads)
      <input type="text" id="folder">
    </label>
    <div class="hint">Chrome can only save inside your Downloads folder. Default is the converter's Data folder.</div>
    <label class="f">Brightspace site<input type="text" id="d2lHost"></label>
    <label class="f">Your D2L role (regex)<input type="text" id="roleMatch"></label>
    <label class="f">D2L term filter, e.g. Fall 2026 (blank = course dates)<input type="text" id="termMatch"></label>
    <label class="f">D2L students (regex)<input type="text" id="studentMatch"></label>
    <label class="f">D2L grade items (regex on "category item name")<input type="text" id="itemMatch"></label>
    <label class="cb" style="margin-top:8px"><input type="checkbox" id="zeroMissing"> Write 0 for missing D2L grades</label>
    <div class="hint">Leave off for the converter — D2L's own export leaves them blank, and 0s would be imported as real grades.</div>
    <label class="f">CompTIA quiz report name contains<input type="text" id="quizReportMatch"></label>
    <div class="row"><button id="reset">Reset defaults</button><button id="save">Save settings</button></div>
  </details>

  <div id="log"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
